<meta name="theme-color" content="#F4F6F8">
<meta name="application-name" content="RevFi">
<meta name="apple-mobile-web-app-title" content="RevFi">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<script>
(function(){
  try {
    var t = localStorage.getItem('revfi-theme');
    if (t === 'light' || t === 'medium' || t === 'modern' || t === 'dark')
      document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F8;
  --surface:#FFFFFF;
  --card:#FFFFFF;
  --input-bg:#F8FAFC;
  --border:#E2E8F0;
  --border-hover:#CBD5E1;
  --accent:#0F9D58;
  --accent2:#0B7A44;
  --accent-soft:#E7F7EE;
  --on-accent:#FFFFFF;
  --warn:#D97706;
  --danger:#DC2626;
  --info:#2563EB;
  --text:#0F172A;
  --muted:#475569;
  --hover:rgba(15,23,42,.045);
  --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04);
  --shadow-md:0 8px 24px rgba(15,23,42,.08);
  --radius:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --nav-w:232px;
}
html[data-theme="medium"]{
  --bg:#2D333B;
  --surface:#3A414C;
  --card:#454D5A;
  --input-bg:#343B46;
  --border:#5C6573;
  --border-hover:#7A8494;
  --accent:#5EE09A;
  --accent2:#3DDC84;
  --accent-soft:rgba(94,224,154,.18);
  --on-accent:#052E16;
  --warn:#F5C14A;
  --danger:#F08A8A;
  --info:#7EB6F6;
  --text:#F4F6F8;
  --muted:#C5CCD6;
  --hover:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.22);
  --shadow-md:0 10px 28px rgba(0,0,0,.32);
}
html[data-theme="modern"]{
  --bg:#F3EFE6;
  --surface:#FFFCF6;
  --card:#FFFCF6;
  --input-bg:#F7F2E8;
  --border:#E4DCCE;
  --border-hover:#D0C4B0;
  --accent:#2F7D57;
  --accent2:#246447;
  --accent-soft:#E4F3EA;
  --on-accent:#FFFFFF;
  --warn:#C67A12;
  --danger:#C2412B;
  --info:#1D6AA5;
  --text:#1C1917;
  --muted:#57534E;
  --hover:rgba(28,25,23,.05);
  --shadow:0 1px 2px rgba(60,48,30,.07),0 2px 8px rgba(60,48,30,.05);
  --shadow-md:0 12px 32px rgba(60,48,30,.12);
}
html[data-theme="dark"]{
  --bg:#10141C;
  --surface:#171C27;
  --card:#1C2330;
  --input-bg:#121722;
  --border:#2A3348;
  --border-hover:#3D4A63;
  --accent:#3DDC84;
  --accent2:#25C26E;
  --accent-soft:rgba(61,220,132,.16);
  --on-accent:#052E16;
  --warn:#FBBF24;
  --danger:#F87171;
  --info:#60A5FA;
  --text:#F1F5F9;
  --muted:#94A3B8;
  --hover:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.28);
  --shadow-md:0 12px 32px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;}
html{color-scheme:light;}
html[data-theme="modern"]{color-scheme:light;}
html[data-theme="medium"],html[data-theme="dark"]{color-scheme:dark;}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}

/* ── Header ── */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200;flex-shrink:0;box-shadow:0 1px 0 rgba(15,23,42,.03);}
.hdr-hamburger{display:none;background:transparent;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:8px;border-radius:8px;line-height:1;min-width:40px;min-height:40px;align-items:center;justify-content:center;flex-shrink:0;}
.hdr-hamburger:hover{background:var(--hover);}
.hdr-theme-btn{background:var(--input-bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 8px;font-size:15px;cursor:pointer;line-height:1;min-width:36px;min-height:36px;flex-shrink:0;}
.hdr-theme-btn:hover{background:var(--hover);}
.hdr-theme-wrap{position:relative;flex-shrink:0;}
.hdr-theme-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-md);padding:6px;z-index:250;min-width:188px;}
.hdr-theme-menu.open{display:block;}
.hdr-theme-opt{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;border:none;background:transparent;color:var(--text);border-radius:8px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;text-align:left;}
.hdr-theme-opt:hover{background:var(--hover);}
.hdr-theme-opt.on{background:var(--accent-soft);color:var(--accent2);}
.hdr-theme-swatch{width:18px;height:18px;border-radius:50%;border:1px solid var(--border);flex-shrink:0;}

/* ── App shell ── */
.app-shell{display:flex;flex:1;min-height:calc(100vh - 52px);}

/* ── Sidebar ── */
.left-nav{width:var(--nav-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:calc(100vh - 52px);overflow-y:auto;position:sticky;top:52px;transition:transform .25s ease;}
.nav-group{border-bottom:1px solid var(--border);}
.nav-group:last-of-type{border-bottom:none;}
.nav-section-label{padding:10px 16px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:none;border:none;cursor:pointer;font-family:inherit;text-align:left;}
.nav-section-label:hover{color:var(--text);background:var(--hover);}
.nav-group.open .nav-section-label{color:var(--text);}
.nav-chevron{font-size:9px;opacity:.7;transition:transform .15s ease;flex-shrink:0;}
.nav-group:not(.open) .nav-chevron{transform:rotate(-90deg);}
.nav-group-items{display:none;}
.nav-group.open .nav-group-items{display:block;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;transition:all .15s;cursor:pointer;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{color:var(--text);background:var(--hover);}
.nav-item.active{color:var(--accent2);background:var(--accent-soft);border-right:2px solid var(--accent);font-weight:600;}
.nav-item .ni{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
.nav-divider{height:1px;background:var(--border);margin:6px 0;}

/* Sidebar mobile overlay */
.nav-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:299;opacity:0;transition:opacity .25s;backdrop-filter:blur(2px);}
.nav-overlay.open{display:block;opacity:1;}

/* ── Page content ── */
.page-content,.main-content,.layout{flex:1;overflow-y:auto;min-width:0;}
.page-body{max-width:1300px;margin:0 auto;padding:24px 28px;}
.main-content{padding:24px 28px;}
.page-header{margin-bottom:22px;}
.page-header h1{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.2;}
.page-header p{font-size:13px;color:var(--muted);margin-top:5px;}
img,video,canvas{max-width:100%;height:auto;}
button,a,.nav-item,.btn{touch-action:manipulation;}

/* ── KPI / Stats ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.stat-card .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
.stat-card .value{font-size:22px;font-weight:800;line-height:1;}
.stat-card .sub{font-size:11px;color:var(--muted);margin-top:4px;}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.kpi,.kpi-card,.hub-card,.pnl-card,.upload-card,.stat-mini,.r-card,.cust-card,.camp-card,.cat-card,.chart-card{box-shadow:var(--shadow);}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#FAFBFC;}
.card-header h2{font-size:13px;font-weight:600;}
.card-body{padding:18px;}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;}
thead{background:#F8FAFC;}
th{padding:10px 12px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:left;white-space:nowrap;}
th.r,td.r{text-align:right;}
td{padding:9px 12px;font-size:12px;border-top:1px solid var(--border);vertical-align:middle;}
tr:hover td{background:var(--hover);}
.table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:auto;background:var(--card);box-shadow:var(--shadow);}

/* ── Badges ── */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;}
.badge-green{background:var(--accent-soft);color:var(--accent2);}
.badge-red{background:#FEE2E2;color:#B91C1C;}
.badge-yellow{background:#FEF3C7;color:#B45309;}
.badge-gray{background:#F1F5F9;color:#475569;}
.badge-blue{background:#DBEAFE;color:var(--info);}
html[data-theme="medium"] .badge-green{background:rgba(94,224,154,.18);color:#5EE09A;}
html[data-theme="medium"] .badge-red{background:rgba(240,138,138,.18);color:#F08A8A;}
html[data-theme="medium"] .badge-yellow{background:rgba(245,193,74,.18);color:#F5C14A;}
html[data-theme="medium"] .badge-gray{background:rgba(197,204,214,.18);color:#C5CCD6;}
html[data-theme="medium"] .badge-blue{background:rgba(126,182,246,.18);color:#7EB6F6;}
html[data-theme="medium"] .card-header,html[data-theme="medium"] .modal-footer{background:#404854;}
html[data-theme="medium"] thead{background:#404854;}
html[data-theme="modern"] .card-header,html[data-theme="modern"] .modal-footer{background:#F7F2E8;}
html[data-theme="modern"] thead{background:#F7F2E8;}
html[data-theme="dark"] .badge-green{background:rgba(61,220,132,.18);color:#3DDC84;}
html[data-theme="dark"] .badge-red{background:rgba(248,113,113,.18);color:#FCA5A5;}
html[data-theme="dark"] .badge-yellow{background:rgba(251,191,36,.18);color:#FBBF24;}
html[data-theme="dark"] .badge-gray{background:rgba(148,163,184,.18);color:#CBD5E1;}
html[data-theme="dark"] .badge-blue{background:rgba(96,165,250,.18);color:#93C5FD;}
html[data-theme="dark"] .card-header,html[data-theme="dark"] .modal-footer{background:#151A24;}
html[data-theme="dark"] thead{background:#151A24;}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s;text-decoration:none;}
.btn-primary{background:var(--accent);color:var(--on-accent);}
.btn-primary:hover{background:var(--accent2);}
.btn-ghost{background:var(--surface);color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--border-hover);background:var(--hover);}
.btn-danger{background:#FEE2E2;color:var(--danger);border:1px solid #FECACA;}
.btn-sm{padding:5px 10px;font-size:11px;}

/* ── Modals ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:300;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:480px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md);}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1;}
.modal-header h3{font-size:14px;font-weight:700;}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:12px;}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:#FAFBFC;}

/* ── Forms ── */
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.field input,.field select,.field textarea{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text);outline:none;width:100%;transition:border-color .15s,box-shadow .15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,157,88,.18);background:#fff;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* ── Toast ── */
#toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:13px;z-index:400;display:none;gap:8px;align-items:center;min-width:200px;max-width:calc(100vw - 40px);box-shadow:var(--shadow-md);}
#toast.show{display:flex;}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px;}

/* ═══════════════════════════════════════════════
   TABLET + PHONE
═══════════════════════════════════════════════ */
@media(max-width:900px){
  .hdr-hamburger{display:flex !important;}
  body.nav-open{overflow:hidden;}

  header{
    height:52px !important;
    padding:0 10px 0 6px !important;
    padding-left:max(6px, env(safe-area-inset-left)) !important;
    padding-right:max(10px, env(safe-area-inset-right)) !important;
  }
  header > div:first-of-type,
  header .logo h1,
  header .header-title{
    font-size:15px !important;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:min(52vw, 220px);
  }
  #hdr-user{max-width:28vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .left-nav{
    display:flex !important;
    position:fixed !important;
    top:52px !important;
    left:0 !important;
    width:min(280px, 88vw) !important;
    height:calc(100vh - 52px) !important;
    height:calc(100dvh - 52px) !important;
    z-index:300 !important;
    transform:translateX(-110%) !important;
    box-shadow:8px 0 32px rgba(15,23,42,.18);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .left-nav.mobile-open{transform:translateX(0) !important;}

  .nav-item{padding:12px 16px;font-size:14px;min-height:44px;}
  .nav-section-label{padding:12px 16px;min-height:40px;}

  .page-body,.main-content{padding:14px 12px;padding-bottom:max(20px, env(safe-area-inset-bottom));}
  .layout{flex-direction:column;}

  .stats-row,.kpi-row{grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card,.kpi{padding:12px 14px;}
  .stat-card .value,.kpi .val,.kpi-card .kpi-val{font-size:18px;}

  .grid-2,.hf-grid,.fields-grid,.sum-grid,.chart-grid,.viq-grid,.upload-grid,.exp-grid,.recon-layout,.pnl-grid,.cat-grid,.form-grid{grid-template-columns:1fr !important;}

  .table-wrap,table{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-wrap{display:block;}
  td,th{padding:8px 10px;font-size:11px;}

  .filter-bar,.filter-row,.kpi-toolbar{flex-wrap:wrap;}
  .tabs,.tab-bar,.filter-pills{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap;max-width:100%;}
  .tab,.fp{white-space:nowrap;flex-shrink:0;}

  .modal{width:100%;max-height:85vh;}
  .modal-footer{justify-content:stretch;}
  .modal-footer .btn{flex:1;justify-content:center;}

  #toast{left:16px;right:16px;bottom:max(16px, env(safe-area-inset-bottom));min-width:unset;}

  .drawer{width:100%!important;max-width:100vw!important;right:-100%!important;}
  .drawer.open{right:0!important;}

  .hide-mobile{display:none!important;}

  input,select,textarea{font-size:16px !important;}
}

@media(max-width:480px){
  .stats-row,.kpi-row{grid-template-columns:1fr;}
  #hdr-user{display:none;}
}
</style>
<script>
window.THEME = {
  catalog: [
    {id:'light',  label:'Light',  icon:'☀️', color:'#F4F6F8', meta:'#F4F6F8'},
    {id:'medium', label:'Medium', icon:'🌤️', color:'#3A414C', meta:'#2D333B'},
    {id:'modern', label:'Modern', icon:'✨', color:'#F3EFE6', meta:'#F3EFE6'},
    {id:'dark',   label:'Dark',   icon:'🌙', color:'#171C27', meta:'#171C27'}
  ],
  ids: function(){ return THEME.catalog.map(function(t){ return t.id; }); },
  info: function(id){
    for (var i = 0; i < THEME.catalog.length; i++) if (THEME.catalog[i].id === id) return THEME.catalog[i];
    return THEME.catalog[0];
  },
  normalize: function(theme){
    return THEME.ids().indexOf(theme) >= 0 ? theme : 'light';
  },
  apply: function(theme) {
    theme = THEME.normalize(theme);
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('revfi-theme', theme); } catch (e) {}
    var info = THEME.info(theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', info.meta);
    var btn = document.getElementById('hdr-theme-btn');
    if (btn) {
      btn.textContent = info.icon;
      btn.title = 'Theme: ' + info.label;
      btn.setAttribute('aria-label', 'Choose theme, current ' + info.label);
    }
    THEME.syncMenu();
  },
  current: function() {
    return THEME.normalize(document.documentElement.getAttribute('data-theme'));
  },
  set: async function(theme) {
    THEME.apply(theme);
    THEME.closeMenu();
    try {
      await fetch('/api/theme', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({theme: THEME.current()})});
    } catch (e) {}
  },
  toggle: async function() {
    var ids = THEME.ids();
    var i = ids.indexOf(THEME.current());
    await THEME.set(ids[(i + 1) % ids.length]);
  },
  closeMenu: function() {
    var m = document.getElementById('hdr-theme-menu');
    if (m) m.classList.remove('open');
    var btn = document.getElementById('hdr-theme-btn');
    if (btn) btn.setAttribute('aria-expanded', 'false');
  },
  syncMenu: function() {
    var cur = THEME.current();
    var opts = document.querySelectorAll('.hdr-theme-opt');
    for (var i = 0; i < opts.length; i++) {
      opts[i].classList.toggle('on', opts[i].getAttribute('data-theme-id') === cur);
    }
  },
  ensureBtn: function() {
    if (document.getElementById('hdr-theme-btn')) {
      THEME.apply(THEME.current());
      return;
    }
    var hdr = document.querySelector('header');
    if (!hdr) return;
    var wrap = document.createElement('div');
    wrap.className = 'hdr-theme-wrap';
    wrap.id = 'hdr-theme-wrap';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'hdr-theme-btn';
    btn.className = 'hdr-theme-btn';
    btn.setAttribute('aria-haspopup', 'true');
    btn.setAttribute('aria-expanded', 'false');
    btn.onclick = function(e){
      e.stopPropagation();
      var m = document.getElementById('hdr-theme-menu');
      if (!m) return;
      var open = !m.classList.contains('open');
      m.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
    var menu = document.createElement('div');
    menu.id = 'hdr-theme-menu';
    menu.className = 'hdr-theme-menu';
    menu.setAttribute('role', 'menu');
    THEME.catalog.forEach(function(t){
      var opt = document.createElement('button');
      opt.type = 'button';
      opt.className = 'hdr-theme-opt';
      opt.setAttribute('data-theme-id', t.id);
      opt.setAttribute('role', 'menuitem');
      opt.innerHTML = '<span class="hdr-theme-swatch" style="background:' + t.color + '"></span>' + t.label;
      opt.onclick = function(e){ e.stopPropagation(); THEME.set(t.id); };
      menu.appendChild(opt);
    });
    wrap.appendChild(btn);
    wrap.appendChild(menu);
    var user = document.getElementById('hdr-user');
    if (user && user.parentNode) user.parentNode.insertBefore(wrap, user);
    else hdr.appendChild(wrap);
    if (!window._themeMenuBound) {
      window._themeMenuBound = true;
      document.addEventListener('click', function(){ THEME.closeMenu(); });
    }
    THEME.apply(THEME.current());
  }
};

// ── Sidebar mobile toggle ──────────────────────────────────────────────────
function _closeMobileNav() {
  var nav = document.querySelector('.left-nav');
  var overlay = document.getElementById('nav-overlay');
  var btn = document.getElementById('hamburger-btn');
  if (nav) nav.classList.remove('mobile-open');
  if (overlay) overlay.classList.remove('open');
  document.body.classList.remove('nav-open');
  if (btn) btn.setAttribute('aria-expanded', 'false');
}
function _ensureHamburger() {
  var hdr = document.querySelector('header');
  if (!hdr || document.getElementById('hamburger-btn')) return;
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'hdr-hamburger';
  btn.id = 'hamburger-btn';
  btn.setAttribute('aria-label', 'Open menu');
  btn.setAttribute('aria-expanded', 'false');
  btn.textContent = '☰';
  hdr.insertBefore(btn, hdr.firstChild);
}
function _initMobileSidebar() {
  _ensureHamburger();
  var nav = document.querySelector('.left-nav');
  var overlay = document.getElementById('nav-overlay');
  var btn = document.getElementById('hamburger-btn');
  if (!nav || !overlay) return;
  if (btn && !btn.dataset.bound) {
    btn.dataset.bound = '1';
    btn.addEventListener('click', function() {
      var open = nav.classList.toggle('mobile-open');
      overlay.classList.toggle('open', open);
      document.body.classList.toggle('nav-open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }
  if (!overlay.dataset.bound) {
    overlay.dataset.bound = '1';
    overlay.addEventListener('click', _closeMobileNav);
  }
  nav.querySelectorAll('a.nav-item').forEach(function(a) {
    if (a.dataset.navBound) return;
    a.dataset.navBound = '1';
    a.addEventListener('click', function() {
      if (window.innerWidth <= 900) _closeMobileNav();
    });
  });
}
window.addEventListener('resize', function() {
  if (window.innerWidth > 900) _closeMobileNav();
});
document.addEventListener('DOMContentLoaded', function() {
  THEME.ensureBtn();
  _ensureHamburger();
  setTimeout(_initMobileSidebar, 400);
});

// ── API Debug Console — intercepts ALL fetch() calls ────────────────────────
(function() {
  var _origFetch = window.fetch;
  window.fetch = async function(url, opts) {
    var method = (opts && opts.method) || 'GET';
    var urlStr = (typeof url === 'string') ? url : url.url || String(url);
    // Skip sidebar polling to reduce noise
    if (urlStr === '/api/sidebar') return _origFetch.apply(this, arguments);
    var dbg = document.getElementById('api-debug');
    var row = null;
    if (dbg) {
      row = document.createElement('div');
      row.style.cssText = 'padding:3px 8px;border-bottom:1px solid #222;font-size:11px;display:flex;gap:8px;align-items:baseline;';
      var ts = new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
      row.innerHTML = '<span style="color:#666;flex-shrink:0;">' + ts + '</span>'
        + '<span style="color:#facc15;flex-shrink:0;">' + method + '</span>'
        + '<span style="color:#93c5fd;flex:1;word-break:break-all;">' + urlStr + '</span>'
        + '<span style="color:#666;">…</span>';
      dbg.appendChild(row);
      dbg.scrollTop = dbg.scrollHeight;
    }
    var t0 = Date.now();
    try {
      var r = await _origFetch.apply(this, arguments);
      var ms = Date.now() - t0;
      var ct = r.headers.get('content-type') || '';
      var isJson = ct.includes('application/json');
      var statusColor = r.ok ? '#4ade80' : '#f87171';
      if (row) {
        var body = opts && opts.body ? String(opts.body).substring(0,120) : '';
        row.innerHTML = '<span style="color:#666;flex-shrink:0;">' + ts + '</span>'
          + '<span style="color:#facc15;flex-shrink:0;">' + method + '</span>'
          + '<span style="color:#93c5fd;flex:1;word-break:break-all;">' + urlStr + '</span>'
          + '<span style="color:' + statusColor + ';flex-shrink:0;">' + r.status + '</span>'
          + '<span style="color:#666;flex-shrink:0;">' + ms + 'ms</span>';
        if (!r.ok) {
          // Clone and show error body
          var errRow = document.createElement('div');
          errRow.style.cssText = 'padding:1px 8px 4px 80px;color:#f87171;font-size:10px;word-break:break-all;';
          r.clone().text().then(function(txt){
            errRow.textContent = txt.substring(0,300);
          }).catch(function(){});
          dbg.appendChild(errRow);
        }
        if (body) {
          var reqRow = document.createElement('div');
          reqRow.style.cssText = 'padding:1px 8px 4px 80px;color:#a78bfa;font-size:10px;word-break:break-all;';
          reqRow.textContent = '→ ' + body;
          dbg.appendChild(reqRow);
        }
        dbg.scrollTop = dbg.scrollHeight;
      }
      return r;
    } catch(e) {
      if (row) {
        row.innerHTML = '<span style="color:#666;flex-shrink:0;">' + ts + '</span>'
          + '<span style="color:#f97316;flex-shrink:0;">' + method + '</span>'
          + '<span style="color:#93c5fd;flex:1;">' + urlStr + '</span>'
          + '<span style="color:#f87171;">💥 ' + e.message + '</span>';
        dbg.scrollTop = dbg.scrollHeight;
      }
      throw e;
    }
  };
})();

// Keep window.apiCall for backward compat
window.apiCall = function(url, opts) { return fetch(url, opts); }

// ── SIDEBAR ────────────────────────────────────────────────────────────────
window.SIDEBAR = {
  load: async function(activeUrl) {
    try {
      var r = await fetch('/api/sidebar');
      if (!r.ok) { window.location.href = '/login'; return null; }
      var d = await r.json();
      if (d.theme) THEME.apply(d.theme);
      THEME.ensureBtn();
      SIDEBAR._render(d, activeUrl || window.location.pathname);
      setTimeout(_initMobileSidebar, 100);
      return d;
    } catch(e) { console.error('SIDEBAR error', e); return null; }
  },
  _render: function(d, cur) {
    var h = document.getElementById('hdr-user');
    if (h) {
      h.textContent = d.name || d.username;
      // Inject API console toggle button next to username if not already there
      if (!document.getElementById('api-console-btn')) {
        var btn = document.createElement('button');
        btn.id = 'api-console-btn';
        btn.title = 'Toggle API Console';
        btn.textContent = '⚡';
        btn.style.cssText = 'background:var(--input-bg);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:13px;cursor:pointer;margin-left:8px;line-height:1;';
        btn.onclick = function(){ _toggleDebugPanel(); };
        h.parentNode && h.parentNode.insertBefore(btn, h.nextSibling);
      }
    }
    var sr = document.getElementById('sb-restaurant');
    if (sr) sr.textContent = (d.restaurant_name||'') + (d.branch?' · '+d.branch:'');
    var su = document.getElementById('sb-user');
    if (su) su.textContent = (d.name||d.username) + ' · ' + (d.role_label||(d.role==='admin'?'Admin':(d.role||'').toUpperCase()));
    var nav = document.getElementById('sb-nav');
    if (!nav) return;
    SIDEBAR._renderNav(nav, d.menus || [], cur);
    setTimeout(_initMobileSidebar, 50);
  },
  _isActive: function(url, cur) {
    if (!url) return false;
    if (url === '/') return cur === '/';
    if (cur === url) return true;
    if (url.endsWith('/') && (cur + '/') === url) return true;
    return cur.indexOf(url + '/') === 0;
  },
  _a: function(m, cur) {
    var act = SIDEBAR._isActive(m.url, cur) ? ' active' : '';
    return '<a href="'+m.url+'" class="nav-item'+act+'"><span class="ni">'+m.icon+'</span>'+m.label+'</a>';
  },
  _renderNav: function(nav, menus, cur) {
    var groups = [];
    var current = null;
    for (var j = 0; j < menus.length; j++) {
      var m = menus[j];
      var sec = m.section || '';
      if (!current || current.section !== sec) {
        current = { section: sec, items: [] };
        groups.push(current);
      }
      current.items.push(m);
    }
    var activeSection = '';
    for (var g = 0; g < groups.length; g++) {
      for (var i = 0; i < groups[g].items.length; i++) {
        if (SIDEBAR._isActive(groups[g].items[i].url, cur)) {
          activeSection = groups[g].section;
          break;
        }
      }
      if (activeSection) break;
    }
    var html = '';
    for (var g = 0; g < groups.length; g++) {
      var grp = groups[g];
      var isOpen = grp.section === activeSection || (!activeSection && g === 0);
      html += '<div class="nav-group' + (isOpen ? ' open' : '') + '">';
      if (grp.section) {
        html += '<button type="button" class="nav-section-label" aria-expanded="' + (isOpen ? 'true' : 'false') + '" onclick="SIDEBAR.toggleGroup(this)">'
              + grp.section + '<span class="nav-chevron">▾</span></button>';
      }
      html += '<div class="nav-group-items">';
      for (var i = 0; i < grp.items.length; i++) {
        html += SIDEBAR._a(grp.items[i], cur);
      }
      html += '</div></div>';
    }
    html += '<div class="nav-divider"></div>';
    html += '<button class="nav-item" onclick="SIDEBAR.logout()"><span class="ni">🚪</span>Logout</button>';
    nav.innerHTML = html;
  },
  toggleGroup: function(btn) {
    var group = btn.closest('.nav-group');
    var nav = document.getElementById('sb-nav');
    if (!nav || !group) return;
    var willOpen = !group.classList.contains('open');
    nav.querySelectorAll('.nav-group.open').forEach(function(g) {
      g.classList.remove('open');
      var header = g.querySelector('.nav-section-label');
      if (header) header.setAttribute('aria-expanded', 'false');
    });
    if (willOpen) group.classList.add('open');
    btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
  },
  logout: async function() {
    await fetch('/api/auth/logout', {method:'POST'});
    window.location.href = '/login';
  }
};
function toast(msg, type) {
  var ic = {info:'ℹ️',success:'✅',error:'❌',warn:'⚠️'};
  var t = document.getElementById('toast');
  if (!t) return;
  document.getElementById('t-icon').textContent = ic[type]||'ℹ️';
  document.getElementById('t-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');}, 3500);
}
function closeModal(id) { var e=document.getElementById(id); if(e) e.classList.remove('open'); }
function _toggleDebugPanel() {
  var p = document.getElementById('debug-panel');
  if (!p) return;
  var visible = p.style.display !== 'none';
  p.style.display = visible ? 'none' : 'flex';
  p.style.flexDirection = 'column';
  var btn = document.getElementById('api-console-btn');
  if (btn) btn.style.background = visible ? 'var(--input-bg)' : '#EDE9FE';
}
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'd') { e.preventDefault(); _toggleDebugPanel(); }
});
