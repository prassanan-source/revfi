<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign In — Revfi SubsManager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#0d1117; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter',system-ui,sans-serif; }
    .login-card { background:#111827; border:1px solid #1f2d3d; border-radius:14px; padding:40px 36px; width:min(420px,95vw); }
    .brand-tag  { font-size:11px; font-weight:800; letter-spacing:2.5px; color:#C9A84C; text-transform:uppercase; }
    .brand-name { font-size:24px; font-weight:800; color:#fff; }
    .form-control { background:#0d1117; border-color:#2a3f58; color:#e2e8f0; }
    .form-control:focus { background:#0d1117; border-color:#C9A84C; color:#e2e8f0; box-shadow:0 0 0 2px rgba(201,168,76,.2); }
    .form-label { font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:#8A9BB0; }
    .btn-gold { background:#C9A84C; color:#0F1C2E; font-weight:700; }
    .btn-gold:hover { background:#b89438; color:#0F1C2E; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="brand-tag">Revfi</div>
      <div class="brand-name">SubsManager</div>
      <div style="font-size:12.5px;color:#8A9BB0;margin-top:4px;">Sales &amp; Subscription Platform</div>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-danger py-2 mb-3" style="font-size:13px;">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="you@revfi.ai" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-gold w-100">Sign In</button>
    </form>
    <div class="text-center mt-4" style="font-size:11.5px;color:#374151;">
      Default: shan@revfi.ai / Admin@123
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
